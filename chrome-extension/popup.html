<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Commentomètre</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="34" height="34">
      <div>
        <h1>Commentomètre</h1>
        <p>Le pouls des commentaires YouTube</p>
      </div>
    </div>
    <div class="tools">
      <button id="themeBtn" class="round" title="Mode sombre / clair" aria-label="Changer de thème">🌙</button>
      <button id="settingsBtn" class="round" title="Réglages" aria-label="Réglages">⚙️</button>
    </div>
  </header>

  <main>
    <section id="settings" class="card settings hidden">
      <h2>Réglages</h2>
      <label for="apiUrl">Adresse de l'API</label>
      <input id="apiUrl" type="url" spellcheck="false" placeholder="https://nom-du-codespace-7860.app.github.dev">
      <div class="row">
        <div class="grow">
          <label for="maxComments">Nombre de commentaires</label>
          <select id="maxComments">
            <option>50</option><option selected>100</option><option>200</option><option>500</option>
          </select>
        </div>
        <label class="switch"><input id="includeReplies" type="checkbox"><span></span> Réponses</label>
      </div>
      <div class="row">
        <button id="saveSettings" class="chip-btn">💾 Enregistrer</button>
        <button id="testApi" class="chip-btn">🔌 Tester l'API</button>
      </div>
      <p id="apiStatus" class="status"></p>
    </section>

    <button id="analyzeBtn" class="cta">✨ Analyser cette vidéo</button>

    <div id="loading" class="loading hidden">
      <div class="progress"><span></span></div>
      <p id="loadingText">Lecture des commentaires…</p>
    </div>
    <p id="error" class="error hidden"></p>

    <section id="results" class="hidden">
      <p id="videoTitle" class="video-title"></p>

      <div class="card mood">
        <div id="mood" class="mood-emoji">😐</div>
        <div class="mood-text">
          <p id="moodLabel" class="mood-label">Accueil mitigé</p>
          <p class="mood-score">Score <b id="score">0</b> <span>sur une échelle de −1 à +1</span></p>
        </div>
      </div>

      <div class="bar" id="bar" role="img" aria-label="Répartition des sentiments">
        <span class="seg pos" id="segPos"></span><span class="seg neu" id="segNeu"></span><span class="seg neg" id="segNeg"></span>
      </div>

      <div class="tiles">
        <div class="tile pos"><span class="t-emoji">😊</span><b id="posPct">0 %</b><small><span id="posN">0</span> positifs</small></div>
        <div class="tile neu"><span class="t-emoji">😐</span><b id="neuPct">0 %</b><small><span id="neuN">0</span> neutres</small></div>
        <div class="tile neg"><span class="t-emoji">😞</span><b id="negPct">0 %</b><small><span id="negN">0</span> négatifs</small></div>
      </div>

      <p class="facts">💬 <b id="total">0</b> commentaires · 🎯 confiance <b id="conf">0 %</b> · ⚡ <b id="latency">0</b> ms</p>

      <div class="toolbar">
        <div class="chips" role="tablist">
          <button class="filter active" data-filter="all">Tous</button>
          <button class="filter" data-filter="1">😊</button>
          <button class="filter" data-filter="0">😐</button>
          <button class="filter" data-filter="-1">😞</button>
        </div>
        <div class="exports">
          <button id="copyBtn" class="mini" title="Copier les résultats">📋 Copier</button>
          <button id="csvBtn" class="mini" title="Exporter en CSV">⬇️ CSV</button>
        </div>
      </div>
      <input id="search" type="search" placeholder="🔎 Rechercher un mot ou un pseudo…">

      <ol id="commentList"></ol>
    </section>
  </main>

  <footer>Fait avec ☕ par Zaid Hsain · ENSAM Rabat</footer>

  <script src="popup.js"></script>
</body>
</html>
