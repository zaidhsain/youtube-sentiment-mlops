<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Commentomètre</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="masthead">
    <div>
      <h1>Commentomètre</h1>
      <p class="tagline">Ce que pensent les commentaires d'une vidéo</p>
    </div>
    <nav>
      <button id="settingsBtn" class="link" aria-label="Réglages">Réglages</button>
      <span class="sep">·</span>
      <button id="themeBtn" class="link" aria-label="Changer de thème">Thème</button>
    </nav>
  </header>

  <section id="settings" class="settings hidden">
    <label for="apiUrl">Adresse de l'API</label>
    <input id="apiUrl" type="url" spellcheck="false" placeholder="https://utilisateur-espace.hf.space">
    <div class="grid2">
      <div>
        <label for="maxComments">Commentaires à lire</label>
        <select id="maxComments">
          <option>50</option><option selected>100</option><option>200</option><option>500</option>
        </select>
      </div>
      <label class="check"><input id="includeReplies" type="checkbox"> inclure les réponses</label>
    </div>
    <div class="actions">
      <button id="saveSettings" class="btn ghost">Enregistrer</button>
      <button id="testApi" class="btn ghost">Tester la connexion</button>
    </div>
    <p id="apiStatus" class="status"></p>
  </section>

  <button id="analyzeBtn" class="btn primary">Analyser cette vidéo</button>

  <p id="loading" class="loading hidden"><span class="dots"></span><span id="loadingText">Lecture des commentaires…</span></p>
  <p id="error" class="error hidden"></p>

  <section id="results" class="hidden">
    <p id="videoTitle" class="video-title"></p>

    <div class="headline">
      <div class="score">
        <span id="score" class="score-value">0</span>
        <span class="score-label">score global<br>de −1 à +1</span>
      </div>
      <p class="summary"><b id="total">0</b> commentaires analysés<br>
        confiance moyenne <b id="conf">0 %</b><br>
        réponse de l'API en <b id="latency">0</b> ms</p>
    </div>

    <div class="bar" id="bar" role="img" aria-label="Répartition des sentiments">
      <span class="seg pos" id="segPos"></span><span class="seg neu" id="segNeu"></span><span class="seg neg" id="segNeg"></span>
    </div>

    <table class="breakdown">
      <thead><tr><th>Sentiment</th><th>Effectif</th><th>Part</th></tr></thead>
      <tbody>
        <tr><td><i class="sw pos"></i>Positif</td><td id="posN">0</td><td id="posPct">0 %</td></tr>
        <tr><td><i class="sw neu"></i>Neutre</td><td id="neuN">0</td><td id="neuPct">0 %</td></tr>
        <tr><td><i class="sw neg"></i>Négatif</td><td id="negN">0</td><td id="negPct">0 %</td></tr>
      </tbody>
    </table>

    <div class="tabs" role="tablist">
      <button class="filter active" data-filter="all">Tous</button>
      <button class="filter" data-filter="1">Positifs</button>
      <button class="filter" data-filter="0">Neutres</button>
      <button class="filter" data-filter="-1">Négatifs</button>
      <span class="spacer"></span>
      <button id="copyBtn" class="link small" title="Copier le résumé et la liste">Copier</button>
      <button id="csvBtn" class="link small" title="Télécharger au format CSV">CSV</button>
    </div>
    <input id="search" type="search" placeholder="Chercher un mot…">

    <ol id="commentList"></ol>
  </section>

  <footer class="colophon">Projet de TP · ENSAM Rabat · Z. Hsain</footer>

  <script src="popup.js"></script>
</body>
</html>
